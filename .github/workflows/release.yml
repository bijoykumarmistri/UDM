name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Decode Release Keystore
        env:
          UDM_KEYSTORE_BASE64: ${{ secrets.UDM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UDM_KEYSTORE_BASE64" ]; then
            printf '%s' "$UDM_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.jks"
          fi

      - name: Build Release APK
        env:
          UDM_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          UDM_KEYSTORE_PASSWORD: ${{ secrets.UDM_KEYSTORE_PASSWORD }}
          UDM_KEY_ALIAS: ${{ secrets.UDM_KEY_ALIAS }}
          UDM_KEY_PASSWORD: ${{ secrets.UDM_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk UDM-${{ github.ref_name }}.apk

      - name: Cleanup Keystore
        if: always()
        run: rm -f "${{ github.workspace }}/release.jks"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: UDM ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            UDM-${{ github.ref_name }}.apk

name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Release APKs
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare Release APKs
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk release-apks/UDM-${{ github.ref_name }}-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk release-apks/UDM-${{ github.ref_name }}-armeabi-v7a.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk release-apks/UDM-${{ github.ref_name }}-x86_64.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: UDM ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-apks/*.apk
